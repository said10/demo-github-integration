name: Deploy SaaS Docs
on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create output directory
        run: mkdir -p _site

      - name: Process Markdown files via Super Markdown API
        env:
          SAAS_AUTH: ${{ secrets.SAAS_APP_AUTH }}
          API_URL: "https://14ee-41-141-163-107.ngrok-free.app/api/space/public/convert-markdown-file/"
        run: |
          for file in docs/*.md; do
            filename=$(basename "$file" .md)
            echo "--- Processus : $file ---"

            # 1. Read the file content
            CONTENT=$(cat "$file" | sed -E 's/(\[[^]]*\]\([^)]*)\.md\)/\1.html)/g')

            # 2. Create JSON payload
            # Fields : name_file, folder, convert (bool), data (string)
            JSON_PAYLOAD=$(jq -n \
              --arg nf "$filename" \
              --arg fd "github_docs" \
              --arg mode "light-mode" \
              --arg dt "$CONTENT" \
              '{filename: $nf, parent: $fd, convert: false, data: $dt, mode: $mode}')

            # 3. Call the API
            RESPONSE=$(curl -s -X POST "$API_URL" \
              -H "app_auth: $SAAS_AUTH" \
              -H "Content-Type: application/json" \
              -d "$JSON_PAYLOAD")

            echo "Response from API : $RESPONSE"

            # 4. Extraction de l'URL
            GENERATED_URL=$(echo "$RESPONSE" | jq -r '.data.url // empty')

            if [ -z "$GENERATED_URL" ] || [ "$GENERATED_URL" = "null" ]; then
                echo "❌ ERROR: The URL could not be extracted for $file."
                exit 1
            fi

            echo "✅ URL of document : $GENERATED_URL"

            # 5. Generating HTML with full-screen iframe
            cat <<EOF > "_site/$filename.html"
          <!DOCTYPE html>
          <html lang="fr">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
              <title>$filename</title>
              <style>
                  body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #fff; }
                  iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
              </style>
          </head>
          <body>
              <iframe src="$GENERATED_URL" allowfullscreen></iframe>
          </body>
          </html>
          EOF
          done

          # Rename index.html if necessary for GitHub Pages

          if [ -f "_site/README.html" ]; then mv _site/README.html _site/index.html; fi
          if [ -f "_site/readme.html" ]; then mv _site/readme.html _site/index.html; fi

          

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
