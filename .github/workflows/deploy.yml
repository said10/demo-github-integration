name: Deploy SaaS Docs
on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create output directory
        run: mkdir -p _site

      - name: Process Markdown files via Super Markdown API
        env:
          SAAS_AUTH: ${{ secrets.SAAS_APP_AUTH }}
          API_URL: "https://14ee-41-141-163-107.ngrok-free.app/api/space/public/convert-markdown/"
        run: |
          for file in docs/*.md; do
            filename=$(basename "$file" .md)
            echo "Processus a $file..."
            
            
            GENERATED_URL=$(curl -s -X POST "$API_URL" \
              -H "app_auth: $SAAS_AUTH" \
              -H "Content-Type: text/markdown" \
              --data-binary "@$file" | jq -r '.url')

            echo "URL reçue: $GENERATED_URL"

            # 2. Génération du fichier HTML avec Iframe plein écran
            cat <<EOF > "_site/$filename.html"
          <!DOCTYPE html>
          <html lang="fr">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
              <title>$filename</title>
              <style>
                  body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #fff; }
                  iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
              </style>
          </head>
          <body>
              <iframe src="$GENERATED_URL" allowfullscreen></iframe>
          </body>
          </html>
          EOF
          done

          # Renommer index.html si nécessaire pour GitHub Pages
          if [ -f "_site/index.html" ]; then
            echo "Index file ready"
          elif [ -f "_site/readme.html" ]; then
            mv _site/readme.html _site/index.html
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: '_site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
